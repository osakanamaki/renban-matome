[project]
name = "renban-matome"
version = "0.0.0"
description = "AviUtl2 スクリプト「連番まとめ」"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "aviutl2-pyrrhulina",
    "go-task-bin>=3.40",
    # テストで直接使う。Image.get_flattened_data は 12.1 から。
    "pillow>=12.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.sources]
aviutl2-pyrrhulina = { url = "https://github.com/osakanamaki/aviutl2-pyrrhulina/releases/download/v0.2.1/aviutl2_pyrrhulina-0.2.1-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
