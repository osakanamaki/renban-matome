<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" role="img" aria-labelledby="title desc">
  <title id="title">連番まとめの使い方</title>
  <desc id="desc">1. タイムラインの「オブジェクト追加」→「連番まとめ」→「連番まとめ（値）」を置いて土台にする。2. 土台のオブジェクト設定の [+] →「連番まとめ」から、連番スロットやテキスト数値スロットなどを使いたい数だけ付ける。3. 土台の値1〜値8を動かすと、その値に従うスロットが一緒に切り替わる。</desc>

  <!--
    ダーク用。ライト用の usage-light.svg とは <style> の色だけが異なる。
    図を変えるときは両方を同じように直すこと。
  -->
  <style>
    text { font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; fill: #e6edf3; }
    .group { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .badge { fill: #1f6feb; }
    .badge-num { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #ffffff; }
    .step-title { font-size: 16px; font-weight: bold; }
    .step-sub { font-size: 12px; fill: #9198a1; }
    .box { fill: #0d1117; stroke: #656c76; stroke-width: 1.5; }
    .box-main { fill: #0c2d6b; stroke: #4493f8; stroke-width: 2; }
    .name { font-size: 14px; text-anchor: middle; }
    .note { font-size: 12px; text-anchor: middle; fill: #9198a1; }
    .edge { fill: none; stroke: #9198a1; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow-head { fill: #9198a1; }
    .dot { fill: #9198a1; }
    .label { font-size: 12px; fill: #9198a1; }
    .strip { fill: #151b23; stroke: #3d444d; stroke-width: 1; }
    .strip-main { fill: #0c2d6b; stroke: #4493f8; stroke-width: 1; }
    .field-head { font-size: 12px; font-weight: bold; }
    .field { font-size: 12px; fill: #9198a1; }
    .field-value { font-size: 12px; }
    .slider-track { stroke: #3d444d; stroke-width: 4; stroke-linecap: round; }
    .slider-fill { stroke: #4493f8; stroke-width: 4; stroke-linecap: round; }
    .slider-knob { fill: #0d1117; stroke: #4493f8; stroke-width: 2; }
    .bar-frame { fill: none; stroke: #656c76; stroke-width: 1.5; }
    .bar-fill { fill: #3fb950; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- 1. 土台を置く -->
  <g id="step1">
    <rect class="group" x="16" y="16" width="264" height="404" rx="12"/>
    <circle class="badge" cx="44" cy="46" r="14"/>
    <text class="badge-num" x="44" y="51">1</text>
    <text class="step-title" x="66" y="52">土台を置く</text>
    <text class="step-sub" x="66" y="74">カスタムオブジェクト</text>

    <g id="menu-add-object">
      <rect class="box" x="40" y="96" width="216" height="52" rx="8"/>
      <text class="name" x="148" y="118">オブジェクト追加</text>
      <text class="note" x="148" y="138">（タイムラインを右クリック）</text>
    </g>
    <path class="edge" d="M 148 148 L 148 164"/>
    <g id="menu-category-1">
      <rect class="box" x="40" y="164" width="216" height="40" rx="8"/>
      <text class="name" x="148" y="189">連番まとめ</text>
    </g>
    <path class="edge" d="M 148 204 L 148 220"/>
    <g id="base-object">
      <rect class="box-main" x="40" y="220" width="216" height="52" rx="8"/>
      <text class="name" x="148" y="242">連番まとめ（値）</text>
      <text class="note" x="148" y="262">（土台）</text>
    </g>

    <text class="note" x="148" y="304">値1〜値8 を持ち、</text>
    <text class="note" x="148" y="322">付いたスロットをまとめて描く</text>
  </g>

  <!-- 2. スロットを付ける -->
  <g id="step2">
    <rect class="group" x="308" y="16" width="264" height="404" rx="12"/>
    <circle class="badge" cx="336" cy="46" r="14"/>
    <text class="badge-num" x="336" y="51">2</text>
    <text class="step-title" x="358" y="52">スロットを付ける</text>
    <text class="step-sub" x="358" y="74">フィルタ効果。使いたい数だけ</text>

    <g id="menu-add-filter">
      <rect class="box" x="332" y="96" width="216" height="52" rx="8"/>
      <text class="name" x="440" y="118">[+]</text>
      <text class="note" x="440" y="138">（土台のオブジェクト設定）</text>
    </g>
    <path class="edge" d="M 440 148 L 440 164"/>
    <g id="menu-category-2">
      <rect class="box" x="332" y="164" width="216" height="40" rx="8"/>
      <text class="name" x="440" y="189">連番まとめ</text>
    </g>
    <path class="edge" d="M 440 204 L 440 228"/>
    <text class="label" x="448" y="221">目的で選ぶ</text>

    <!-- スロットは今後も増えるため、代表の2つだけ載せて縦の「・・・」で続きを示す -->
    <g id="slot-sequence">
      <rect class="box" x="324" y="228" width="232" height="40" rx="8"/>
      <text class="name" x="440" y="253">連番スロット</text>
    </g>
    <g id="slot-text">
      <rect class="box" x="324" y="276" width="232" height="40" rx="8"/>
      <text class="name" x="440" y="301">テキスト数値スロット</text>
    </g>
    <g id="slot-more">
      <circle class="dot" cx="440" cy="330" r="2.5"/>
      <circle class="dot" cx="440" cy="342" r="2.5"/>
      <circle class="dot" cx="440" cy="354" r="2.5"/>
    </g>

  </g>

  <!-- 3. 値を動かす -->
  <g id="step3">
    <rect class="group" x="600" y="16" width="264" height="404" rx="12"/>
    <circle class="badge" cx="628" cy="46" r="14"/>
    <text class="badge-num" x="628" y="51">3</text>
    <text class="step-title" x="650" y="52">値を動かす</text>
    <text class="step-sub" x="650" y="74">従うスロットが一緒に切り替わる</text>

    <!-- オブジェクト設定の見本 -->
    <g id="settings-panel">
      <rect class="box" x="616" y="96" width="232" height="226" rx="8"/>
      <text class="note" x="732" y="114">オブジェクト設定</text>

      <g id="panel-base">
        <rect class="strip-main" x="624" y="124" width="216" height="24" rx="4"/>
        <text class="field-head" x="632" y="141">連番まとめ（値）</text>
        <text class="field" x="632" y="172">値1</text>
        <line class="slider-track" x1="668" y1="168" x2="804" y2="168"/>
        <line class="slider-fill" x1="668" y1="168" x2="708" y2="168"/>
        <circle class="slider-knob" cx="708" cy="168" r="6"/>
        <text class="field-value" x="832" y="172" text-anchor="end">3</text>
      </g>

      <g id="panel-slot-sequence">
        <rect class="strip" x="624" y="186" width="216" height="24" rx="4"/>
        <text class="field-head" x="632" y="203">連番スロット</text>
        <text class="field" x="632" y="230">画像</text>
        <text class="field-value" x="700" y="230">hp_000.png</text>
        <text class="field" x="632" y="252">従う値</text>
        <text class="field-value" x="700" y="252">値1</text>
      </g>

      <g id="panel-slot-text">
        <rect class="strip" x="624" y="264" width="216" height="24" rx="4"/>
        <text class="field-head" x="632" y="281">テキスト数値スロット</text>
        <text class="field" x="632" y="308">テキスト</text>
        <text class="field-value" x="700" y="308">HP {値1}</text>
      </g>
    </g>

    <path class="edge" d="M 732 322 L 732 352"/>
    <text class="label" x="740" y="342">値1 = 3 のとき</text>

    <!-- プレビューの見本（hp_003.png と「HP 3」が出る）。文字とバーをまとめて枠の中央（x=732）に置く -->
    <g id="preview">
      <rect class="box" x="636" y="352" width="192" height="52" rx="8"/>
      <text class="name" x="672" y="383">HP 3</text>
      <rect class="bar-frame" x="700" y="371" width="108" height="14" rx="3"/>
      <rect class="bar-fill" x="702" y="373" width="30" height="10" rx="2"/>
    </g>
  </g>

  <!-- 手順の順番 -->
  <g id="edges-steps">
    <path class="edge" d="M 282 46 L 306 46"/>
    <path class="edge" d="M 574 46 L 598 46"/>
  </g>
</svg>
