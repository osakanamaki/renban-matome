# main の wiki/ フォルダを、GitHub の Wiki（renban-matome.wiki.git）へ反映する。
#
# Wiki の原稿はリポジトリの wiki/ で管理する。Wiki 上で直接書いた変更は、次の反映で上書きされる。
# wiki/ から消したページは、Wiki からも消える。
name: Wiki へ反映

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
  # Actions の画面から、手で反映することもできる。
  workflow_dispatch:

permissions:
  contents: write

# 反映が重なったときは、順番に1つずつ行う。
concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v4

      - name: Wiki を取り出す
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repository

      - name: wiki/ の中身を Wiki に写す
        run: |
          # .git 以外を、wiki/ と同じ中身にする（wiki/ に無いページは消す）。
          rsync --archive --delete --exclude ".git" wiki/ wiki-repository/

      - name: 変更があれば Wiki に push する
        working-directory: wiki-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki に変更はありません。"
            exit 0
          fi
          git commit --message "wiki/ を反映する（${GITHUB_SHA::7}）"
          git push origin HEAD
